name: Release artifact (manual)
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack
      - run: sha256sum mote-*.tgz > mote-package.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mote-package-${{ github.sha }}
          path: |
            mote-*.tgz
            mote-package.sha256
      # Publishing is intentionally absent. npm publish needs a separately
      # authorized release decision and provenance configuration.
