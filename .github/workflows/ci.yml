name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/cli.mjs
      - run: node tests/consumer.mjs
      - run: node bench/audit.mjs
      - run: node bench/research.mjs audit-corpus
      - run: node interop/audit.mjs
      - run: npm run interop:matrix
      - run: npm run release:check
      - run: node eval/run.mjs
